name: CI - Vasileva Todo App

on:
  push:
    branches: [ main ]
    paths:
      - 'students/vasileva/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: students/vasileva

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate Docker image tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: students/vasileva
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/todoapp:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_USERNAME }}/todoapp:latest

      - name: Decode SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > ec2-key.pem
          chmod 600 ec2-key.pem

      - name: Copy Terraform files to server
        run: |
          rsync -avz \
            -e "ssh -i ec2-key.pem -p ${{ secrets.EC2_PORT }} -o StrictHostKeyChecking=no" \
            infra/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/todoapp/infra/

      - name: Deploy via Terraform on server
        run: |
          ssh -i ec2-key.pem -p ${{ secrets.EC2_PORT }} -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
          cd todoapp/infra
          terraform init -input=false
          terraform apply -auto-approve -var="docker_image=${{ secrets.DOCKER_USERNAME }}/todoapp:${{ env.IMAGE_TAG }}"
          EOF
